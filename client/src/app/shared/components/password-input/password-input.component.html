<mat-form-field appearance="outline" class="full-width">
    <mat-label>{{ label() }}</mat-label>
    <input
        matInput
        [type]="hidden() ? 'password' : 'text'"
        [formControlName]="controlName()"
        [placeholder]="placeholder()"
        [autocomplete]="autocomplete()"
    />
    <button
        mat-icon-button
        matSuffix
        type="button"
        (click)="hidden.set(!hidden())"
        [attr.aria-label]="'Toggle ' + label() + ' visibility'"
        [attr.aria-pressed]="!hidden()"
    >
        <mat-icon>{{ hidden() ? "visibility_off" : "visibility" }}</mat-icon>
    </button>

    @if (control?.hasError("required") && control?.touched) {
        <mat-error>{{ requiredMessage() }}</mat-error>
    }
    @if (control?.hasError("minlength")) {
        <mat-error>{{ minlengthMessage() }}</mat-error>
    }
    @if (mismatchVisible()) {
        <mat-error>{{ mismatchMessage() }}</mat-error>
    }
</mat-form-field>
