@if (isActive && selectedRole) {
    <div class="alert-sticky">
        <div class="alert-content">
            <div class="alert-icon">
                <mat-icon>info</mat-icon>
            </div>
            <div class="alert-message">
                <strong>Impersonation Active</strong>
                <span>You are currently viewing permissions as </span>
                <mat-chip [style.background]="getRoleColor(selectedRole)">
                    {{ getRoleName(selectedRole) }}
                </mat-chip>
            </div>
            <button mat-icon-button (click)="closeAlert()" [disabled]="isLoading" class="close-btn">
                <mat-icon>close</mat-icon>
            </button>
        </div>
    </div>
}
