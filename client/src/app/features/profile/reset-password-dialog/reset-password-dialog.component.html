<h2 mat-dialog-title>Reset password</h2>

<mat-dialog-content>
    <p>
        A random temporary password will be emailed to the user. It stops working after 24 hours, and they will be asked
        to choose their own password the first time they sign in.
    </p>
    <p>Anyone signed in as this user will be signed out.</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button type="button" (click)="onCancel()" [disabled]="loading()">Cancel</button>
    <app-loading-button
        label="Send temporary password"
        loadingLabel="Sending..."
        color="warn"
        [loading]="loading()"
        (buttonClick)="onSubmit()"
    ></app-loading-button>
</mat-dialog-actions>
