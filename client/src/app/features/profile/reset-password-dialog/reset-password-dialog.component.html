<h2 mat-dialog-title>Reset Password</h2>

<mat-dialog-content>
    <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
        <app-password-input
            controlName="newPassword"
            label="New Password"
            autocomplete="new-password"
            requiredMessage="New password is required"
            minlengthMessage="Password must be at least 6 characters"
        />

        <app-password-input
            controlName="confirmPassword"
            label="Confirm New Password"
            autocomplete="new-password"
            requiredMessage="Please confirm the new password"
            [mismatchVisible]="hasPasswordMismatch()"
            [mismatchMessage]="'New password and confirm password must match'"
        />
    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button type="button" (click)="onCancel()" [disabled]="loading">Cancel</button>
    <button
        mat-raised-button
        color="warn"
        type="button"
        (click)="onSubmit()"
        [disabled]="passwordForm.invalid || loading"
    >
        @if (loading) {
            <mat-spinner diameter="20"></mat-spinner>
            Saving...
        } @else {
            Reset Password
        }
    </button>
</mat-dialog-actions>
