<h2 mat-dialog-title>{{ isEdit ? "Edit Department" : "Create Department" }}</h2>

<mat-dialog-content>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Department Name</mat-label>
            <input matInput formControlName="name" placeholder="Engineering" />
            @if (form.get("name")?.hasError("required") && form.get("name")?.touched) {
                <mat-error>Department name is required</mat-error>
            }
            @if (form.get("name")?.hasError("minlength")) {
                <mat-error>Name must be at least 2 characters</mat-error>
            }
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Description</mat-label>
            <textarea matInput formControlName="description" rows="3" placeholder="Optional"></textarea>
        </mat-form-field>

        @if (isEdit) {
            <div class="toggle-row">
                <mat-slide-toggle formControlName="isActive" color="primary">Active</mat-slide-toggle>
            </div>
        }
    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button type="button" (click)="onCancel()" [disabled]="loading">Cancel</button>
    <app-loading-button
        [label]="isEdit ? 'Save Changes' : 'Create'"
        [loadingLabel]="isEdit ? 'Saving...' : 'Creating...'"
        [loading]="loading"
        [disabled]="form.invalid || loading"
        [minWidth]="'150px'"
        (buttonClick)="onSubmit()"
    ></app-loading-button>
</mat-dialog-actions>
