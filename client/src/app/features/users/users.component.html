<div class="users-container">
    <div class="page-header">
        <h1>User Management</h1>
        <button class="btn btn-primary" (click)="openCreateModal()">
            <span class="icon">+</span>
            Create User
        </button>
    </div>

    <div class="error-message" *ngIf="error">{{ error }}</div>

    <div class="loading-spinner" *ngIf="loading && users.length === 0">Loading users...</div>

    <div class="users-table" *ngIf="!loading || users.length > 0">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Company ID</th>
                    <th>Status</th>
                    <th>Created</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let user of users">
                    <td>{{ user.name }}</td>
                    <td>{{ user.email }}</td>
                    <td>
                        <span class="badge" [ngClass]="getRoleBadgeClass(user.role)">
                            {{ user.role }}
                        </span>
                    </td>
                    <td>{{ user.companyId || "N/A" }}</td>
                    <td>
                        <span
                            class="status"
                            [class.active]="user.isActive"
                            [class.inactive]="!user.isActive"
                        >
                            {{ user.isActive ? "Active" : "Inactive" }}
                        </span>
                    </td>
                    <td>{{ formatDate(user.createdAt) }}</td>
                    <td class="actions">
                        <button class="btn-icon" title="Edit">✏️</button>
                        <button class="btn-icon" title="Delete">🗑️</button>
                    </td>
                </tr>
                <tr *ngIf="users.length === 0">
                    <td colspan="7" class="empty-state">No users found</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Create User Modal -->
    <div class="modal-overlay" *ngIf="showCreateModal" (click)="closeCreateModal()">
        <div class="modal-content" (click)="$event.stopPropagation()">
            <div class="modal-header">
                <h2>Create New User</h2>
                <button class="close-btn" (click)="closeCreateModal()">&times;</button>
            </div>

            <form (ngSubmit)="createUser()">
                <div class="form-group">
                    <label for="name">Name *</label>
                    <input
                        type="text"
                        id="name"
                        [(ngModel)]="newUser.name"
                        name="name"
                        required
                        placeholder="Enter full name"
                    />
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input
                        type="email"
                        id="email"
                        [(ngModel)]="newUser.email"
                        name="email"
                        required
                        placeholder="user@example.com"
                    />
                </div>

                <div class="form-group">
                    <label for="password">Password *</label>
                    <input
                        type="password"
                        id="password"
                        [(ngModel)]="newUser.password"
                        name="password"
                        required
                        placeholder="Enter temporary password"
                    />
                </div>

                <div class="form-group">
                    <label for="role">Role *</label>
                    <select id="role" [(ngModel)]="newUser.role" name="role" required>
                        <option *ngFor="let role of roles" [value]="role.value">
                            {{ role.label }}
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="companyId">Company ID</label>
                    <input
                        type="text"
                        id="companyId"
                        [(ngModel)]="newUser.companyId"
                        name="companyId"
                        placeholder="Optional: company-a"
                    />
                </div>

                <div class="form-group">
                    <label for="departmentId">Department ID</label>
                    <input
                        type="text"
                        id="departmentId"
                        [(ngModel)]="newUser.departmentId"
                        name="departmentId"
                        placeholder="Optional: dept-hr"
                    />
                </div>

                <div class="error-message" *ngIf="error">{{ error }}</div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" (click)="closeCreateModal()">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-primary" [disabled]="loading">
                        {{ loading ? "Creating..." : "Create User" }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
