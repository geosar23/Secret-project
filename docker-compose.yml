services:
  server:
    build:
      context: ./server
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        API_URL: http://localhost:3000/api
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped
